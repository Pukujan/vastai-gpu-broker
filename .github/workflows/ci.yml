name: gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@v4
      - name: Check out pinned Content Generation Modules
        uses: actions/checkout@v4
        with:
          repository: Pukujan/content-generation-modules
          ref: c069613ca8b3e02bcf5aba1960160583537f8a3a
          path: .cgm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CGM pin, boot injection, and asset provenance
        run: python scripts/validate_cgm_adoption.py --helper-root .cgm
      - name: Validate pinned CGM adapter
        run: python .cgm/scripts/validate_content_system.py --root .cgm --adapter .content-system --project-root .
      - name: Verify always-on writing automation
        run: python .cgm/scripts/verify_hsw_applied.py --root .cgm
      - name: Install package and pinned continuity validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
          python -m pip install "git+https://github.com/Pukujan/project-continuity-modules.git@412d190e6244ef59279ad5d60f4c7622bfb43e5f"
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run acceptance and metamorphic tests
        run: python -m pytest -q
      - name: Validate Project Continuity adoption
        run: continuity validate --root .
