name: Sync Vast.ai offers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: vast-offer-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh current marketplace snapshot
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python scripts/sync_offers.py
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Offer snapshot unchanged."
          else
            git commit -m "Refresh Vast.ai offer snapshot"
            git push
          fi
