[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vastai-gpu-broker"
version = "0.1.0"
description = "Research-first ephemeral Vast.ai GPU hosting broker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
recovery = ["boto3>=1.36"]

[project.scripts]
vast-broker = "vast_broker.cli:main"
vast-broker-guardian = "vast_broker.guardian_http:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
